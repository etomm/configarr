name: Documentation

on:
  push:
    tags:
      - "v*.*.*"
    paths:
      - docs/**
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          package-manager-cache: false

      - name: Install & build
        working-directory: docs
        env:
          PNPM_CONFIG_IGNORE_WORKSPACE: "true"
          # Optional repository variables. Unset keeps the production site (https://configarr.de, "/").
          # A fork on a GitHub Pages project site sets e.g. DOCS_URL=https://<owner>.github.io and
          # DOCS_BASE_URL=/<repo>/.
          DOCS_URL: ${{ vars.DOCS_URL }}
          DOCS_BASE_URL: ${{ vars.DOCS_BASE_URL }}
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Upload static files as artifact
        id: deployment
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./docs/build

  deploy:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
